<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Schiavon - Consultoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ouro: #d4af37;
            --preto: #1a1a1a;
            --creme: #f5f2e9; 
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--creme); 
            color: var(--preto); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
        }

        .container { 
            max-width: 480px; 
            width: 100%; 
            text-align: center;
        }

        /* Logo Flat no Topo */
        .logo-topo {
            width: 160px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 { 
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: var(--ouro);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .form-group { text-align: left; margin-bottom: 15px; }
        
        label { display: block; font-size: 0.75rem; color: #666; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }

        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            background: #fff;
            box-sizing: border-box;
            outline: none;
        }

        .btn-revelar { 
            width: 100%; 
            padding: 18px; 
            background: var(--preto); 
            color: var(--ouro); 
            border: 1px solid var(--ouro);
            border-radius: 4px;
            margin-top: 20px; 
            cursor: pointer; 
            font-family: 'Cinzel', serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .btn-revelar:hover { background: #000; }

        /* Resultado em Estilo Cartão Premium */
        #resultado { 
            display: none; 
            margin-top: 30px; 
            animation: fadeIn 0.8s ease forwards;
        }

        .card-premium {
            background: var(--preto);
            color: #fff;
            padding: 35px 25px;
            border-radius: 2px;
            text-align: left;
            border: 1px solid var(--ouro);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2.card-titulo {
            font-family: 'Cinzel', serif;
            color: var(--ouro);
            font-size: 1.1rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .bloco-info { margin-bottom: 20px; }
        .label-ouro { color: var(--ouro); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; display: block; margin-bottom: 4px; }
        .texto-res { font-size: 0.95rem; line-height: 1.5; font-weight: 300; }

        .dica-uso { 
            margin-top: 25px; 
            padding-top: 15px; 
            border-top: 1px solid #333; 
            font-size: 0.85rem; 
            color: #aaa; 
            font-style: italic; 
            display: block;
        }

        .btn-voltar {
            background: none;
            border: none;
            color: #888;
            text-decoration: underline;
            margin-top: 30px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <img src="flat.jpg" alt="Boutique Schiavon" class="logo-topo">
    <h1>Consultoria de Assinatura</h1>
    
    <div id="sessao-input">
        <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="text" id="data_nasc" placeholder="DD/MM/AAAA">
        </div>

        <div class="form-group">
            <label>Nota Olfativa de Preferência</label>
            <input type="text" id="nota_user" placeholder="Ex: Baunilha, Sândalo...">
        </div>
        
        <div class="form-group">
            <label>Ocasião Desejada</label>
            <select id="ocasiao">
                <option value="reuniao">Trabalho / Reunião</option>
                <option value="festa">Festa / Evento Social</option>
                <option value="encontro_romantico">Encontro Romântico</option>
                <option value="balada">Noite / Balada</option>
                <option value="atividades_fisicas">Esportes</option>
            </select>
        </div>
        
        <button class="btn-revelar" onclick="analisarPerfumes()">Revelar Minha Seleção</button>
    </div>

    <div id="resultado">
        <div class="card-premium">
            <h2 class="card-titulo">Sua Curadoria Presença</h2>

            <div class="bloco-info">
                <span class="label-ouro">Sua Identidade Astral:</span>
                <span id="res-identidade" class="texto-res"></span>
            </div>

            <div class="bloco-info">
                <span class="label-ouro">Sugestão Schiavon:</span>
                <span id="res-recomendacao" class="texto-res"></span>
            </div>

            <div class="bloco-info">
                <span class="label-ouro">Perfil Sugerido:</span>
                <span id="res-idade" class="texto-res"></span>
            </div>
            
            <span class="dica-uso">
                Nota Personalizada: Como você aprecia <span id="res-nota-cliente" style="color:var(--ouro)"></span>, aplique a fragrância em pontos de pulsação para uma performance superior.
            </span>
        </div>
        
        <button class="btn-voltar" onclick="window.location.reload()">Realizar Nova Consultoria</button>
    </div>
</div>

<script>
    async function analisarPerfumes() {
        const btn = document.querySelector('.btn-revelar');
        const nota = document.getElementById('nota_user').value;
        btn.innerText = "BUSCANDO NO ACERVO...";
        
        const payload = {
            data_nasc: document.getElementById('data_nasc').value,
            ocasiao: document.getElementById('ocasiao').value,
            cidade: "Duque de Caxias"
        };

        try {
            // Conexão com seu backend no Render
            const resposta = await fetch('https://app-perfumes-qf4c.onrender.com/selecao', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            const dados = await resposta.json();

            // Esconde formulário e mostra cartão
            document.getElementById('sessao-input').style.display = 'none';
            document.getElementById('resultado').style.display = 'block';
            
            // Mapeamento correto dos dados do seu app.py para evitar 'undefined'
            document.getElementById('res-identidade').innerText = dados.identidade;
            document.getElementById('res-recomendacao').innerText = dados.recomendacao;
            document.getElementById('res-idade').innerText = dados.idade_perfil;
            document.getElementById('res-nota-cliente').innerText = nota || "notas nobres";

        } catch (erro) {
            console.error("Erro na API:", erro);
            alert("Não foi possível acessar a consultoria agora. Verifique se o seu servidor no Render está ativo.");
            btn.innerText = "REVELAR MINHA SELEÇÃO";
        }
    }
</script>

</body>
</html>
