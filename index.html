<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultoria de Fragrâncias - Boutique</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #666;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #555;
        }
        #resultado {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #eee;
            display: none;
            line-height: 1.6;
            background-color: #fff;
        }
        .btn-nova-consulta {
            margin-top: 20px;
            background-color: #888;
            padding: 10px;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            font-size: 0.9rem;
            color: #999;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Consultoria de Fragrâncias</h1>
    
    <div id="formulario">
        <div class="form-group">
            <label>Cidade</label>
            <input type="text" id="cidade" placeholder="Ex: Rio de Janeiro">
        </div>

        <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="text" id="data_nasc" placeholder="DD/MM/AAAA">
        </div>

        <div class="form-group">
            <label>Nota Olfativa Favorita</label>
            <input type="text" id="nota_fav" placeholder="Ex: Floral, Amadeirado...">
        </div>

        <div class="form-group">
            <label>Ocasião</label>
            <select id="ocasiao">
                <option value="trabalho">Trabalho</option>
                <option value="encontro">Encontro</option>
                <option value="festa">Festa</option>
                <option value="balada">Balada</option>
                <option value="dia_a_dia">Dia a dia</option>
            </select>
        </div>

        <button id="btnEnviar" onclick="enviarConsulta()">Revelar Seleção</button>
    </div>

    <div id="loading" class="loading">Buscando as melhores fragrâncias...</div>
    
    <div id="resultado"></div>
</div>

<script>
    async function enviarConsulta() {
        const resDiv = document.getElementById('resultado');
        const loadDiv = document.getElementById('loading');
        const formDiv = document.getElementById('formulario');

        const dados = {
            cidade: document.getElementById('cidade').value,
            data_nasc: document.getElementById('data_nasc').value,
            nota_fav: document.getElementById('nota_fav').value,
            ocasiao: document.getElementById('ocasiao').value.toLowerCase()
        };

        if (!dados.cidade || !dados.data_nasc || !dados.nota_fav) {
            alert("Por favor, preencha todos os campos corretamente.");
            return;
        }

        formDiv.style.display = 'none';
        loadDiv.style.display = 'block';
        resDiv.style.display = 'none';

        try {
            const response = await fetch('https://app-perfumes-qf4c.onrender.com/selecao', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            const r = await response.json();

            if (r.status === "sucesso") {
                resDiv.innerHTML = `
                    <p>${r.mensagem}</p>
                    <p><strong>Identidade:</strong> ${r.identidade}</p>
                    <p><strong>Recomendação:</strong> ${r.recomendacao}</p>
                    <p><em>${r.dica}</em></p>
                    <button class="btn-nova-consulta" onclick="window.location.reload()">Fazer Nova Consulta</button>
                `;
                resDiv.style.display = 'block';
            }
        } catch (error) {
            alert("O servidor está processando. Tente novamente em alguns segundos.");
            formDiv.style.display = 'block';
        } finally {
            loadDiv.style.display = 'none';
        }
    }
</script>

</body>
</html>
