<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique de Fragrâncias</title>
    <style>
        body { font-family: 'Georgia', serif; background-color: #fff; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 450px; width: 100%; padding: 30px; border: 1px solid #eee; }
        h1 { text-align: center; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #d4af37; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-size: 0.8rem; color: #888; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #1a1a1a; color: #fff; border: none; margin-top: 20px; cursor: pointer; text-transform: uppercase; }
        #resultado, #busca-extra { margin-top: 30px; display: none; border-top: 1px solid #eee; padding-top: 20px; }
        .uau-box { background: #f9f9f9; padding: 15px; border-left: 3px solid #d4af37; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Consultoria</h1>
    
    <div id="form-perfil">
        <label>Cidade</label>
        <input type="text" id="cidade" placeholder="Sua cidade">
        <label>Data de Nascimento</label>
        <input type="text" id="data_nasc" placeholder="DD/MM/AAAA">
        <label>Nota Favorita</label>
        <input type="text" id="nota_fav" placeholder="Ex: Baunilha, Cafe">
        <label>Ocasião</label>
        <select id="ocasiao">
            <option value="reuniao">Trabalho</option>
            <option value="festa">Festa</option>
            <option value="encontro_romantico">Encontro</option>
            <option value="balada">Balada</option>
        </select>
        <button onclick="gerarPerfil()">Descobrir Minha Assinatura</button>
    </div>

    <div id="resultado"></div>

    <div id="busca-extra">
        <h2 style="font-size: 1rem; font-weight: 400;">Deseja explorar mais?</h2>
        <p style="font-size: 0.8rem; color: #999;">Busque por uma marca, ingrediente ou estilo (ex: Floral, Cacau, Dior)</p>
        <input type="text" id="termo_busca" placeholder="O que voce procura?">
        <button onclick="buscarManual()" style="background: #d4af37;">Consultar Acervo</button>
        <div id="res-manual" class="uau-box" style="display:none;"></div>
        <button onclick="window.location.reload()" style="background:#eee; color:#666; font-size:0.7rem;">Nova Consultoria Completa</button>
    </div>
</div>

<script>
    const BASE_URL = 'https://app-perfumes-qf4c.onrender.com';

    async function gerarPerfil() {
        const dados = {
            cidade: document.getElementById('cidade').value,
            data_nasc: document.getElementById('data_nasc').value,
            ocasiao: document.getElementById('ocasiao').value
        };

        const resp = await fetch(`${BASE_URL}/selecao`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(dados)
        });
        const r = await resp.json();

        if(r.status === 'sucesso') {
            document.getElementById('form-perfil').style.display = 'none';
            document.getElementById('resultado').innerHTML = `
                <p><strong>${r.identidade}</strong></p>
                <p>${r.recomendacao}</p>
                <p><em>${r.idade_perfil}</em></p>
                <p style="font-size:0.8rem; color:#d4af37;">${r.dica}</p>
            `;
            document.getElementById('resultado').style.display = 'block';
            document.getElementById('busca-extra').style.display = 'block';
        }
    }

    async function buscarManual() {
        const termo = document.getElementById('termo_busca').value;
        const box = document.getElementById('res-manual');
        box.style.display = 'block';
        box.innerHTML = "Buscando detalhes...";

        const resp = await fetch(`${BASE_URL}/buscar?termo=${termo}`);
        const r = await resp.json();
        box.innerHTML = r.resultado;
    }
</script>

</body>
</html>
