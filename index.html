<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Fragrâncias</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #666;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #555;
        }
        #resultado {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #eee;
            display: none;
            line-height: 1.6;
        }
        .loading {
            text-align: center;
            font-size: 0.9rem;
            color: #999;
            display: none;
        }
    </style>
</head>
<body>


<div class="container">
    <h1>CONSULTORIA DE FRAGRÂNCIAS</h1>
    
    <div class="form-group">
        <label>Cidade</label>
        <input type="text" id="cidade" placeholder="Ex: Curitiba">
    </div>


    <div class="form-group">
        <label>Data de Nascimento</label>
        <input type="text" id="data_nasc" placeholder="DD/MM/AAAA">
    </div>


    <div class="form-group">
        <label>Nota Olfativa Favorita</label>
        <input type="text" id="nota_fav" placeholder="Ex: Baunilha">
    </div>


    <div class="form-group">
        <label>Ocasião</label>
        <select id="ocasiao">
            <option value="trabalho">Trabalho</option>
            <option value="encontro">Encontro</option>
            <option value="festa">Festa</option>
            <option value="balada">Balada</option>
            <option value="dia_a_dia">Dia a dia</option>
        </select>
    </div>


    <button onclick="enviarConsulta()">Revelar Seleção</button>


    <div id="loading" class="loading">Processando sua seleção...</div>
    <div id="resultado"></div>
</div>


<script>
    async function enviarConsulta() {
        const btn = document.querySelector('button');
        const resDiv = document.getElementById('resultado');
        const loadDiv = document.getElementById('loading');


        const dados = {
            cidade: document.getElementById('cidade').value,
            data_nasc: document.getElementById('data_nasc').value,
            nota_fav: document.getElementById('nota_fav').value,
            ocasiao: document.getElementById('ocasiao').value
        };


        if (!dados.cidade || !dados.data_nasc || !dados.nota_fav) {
            alert("Por favor, preencha todos os campos.");
            return;
        }


        btn.style.display = 'none';
        loadDiv.style.display = 'block';
        resDiv.style.display = 'none';


        try {
            //https://app-perfumes-qf4c.onrender.com
            const response = await fetch('https://app-perfumes-qf4c.onrender.com/selecao', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });


            const r = await response.json();


            if (r.status === "sucesso") {
                resDiv.innerHTML = `
                    <p>${r.mensagem}</p>
                    <p><strong>Identidade:</strong> ${r.identidade}</p>
                    <p><strong>Recomendação:</strong> ${r.recomendacao}</p>
                    <p><em>${r.dica}</em></p>
                `;
                resDiv.style.display = 'block';
            }
        } catch (error) {
            alert("Erro ao conectar com o servidor. Verifique se a API no Render está ativa.");
        } finally {
            btn.style.display = 'block';
            loadDiv.style.display = 'none';
        }
    }
</script>


</body>
</html>
