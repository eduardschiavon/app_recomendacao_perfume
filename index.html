<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Schiavon - Consultoria de Assinatura</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ouro: #d4af37;
            --preto: #1a1a1a;
            --creme: #f5f2e9; 
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--creme); 
            color: var(--preto); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
        }

        .container { 
            max-width: 480px; 
            width: 100%; 
            text-align: center;
        }

        .logo-topo {
            width: 150px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 { 
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--ouro);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .form-group { text-align: left; margin-bottom: 15px; }
        
        label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; text-transform: uppercase; }

        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            background: #fff;
            box-sizing: border-box;
        }

        .btn-revelar { 
            width: 100%; 
            padding: 18px; 
            background: var(--preto); 
            color: var(--ouro); 
            border: 1px solid var(--ouro);
            border-radius: 4px;
            margin-top: 20px; 
            cursor: pointer; 
            font-family: 'Cinzel', serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ESTILO CARTÃO PREMIUM (O que você queria de volta) */
        #resultado { 
            display: none; 
            margin-top: 30px; 
            animation: fadeIn 0.8s ease;
        }

        .card-consultoria {
            background: var(--preto);
            color: #fff;
            padding: 30px;
            border-radius: 4px;
            position: relative;
            text-align: left;
            border: 1px solid var(--ouro);
        }

        .selo-presenca {
            width: 120px;
            display: block;
            margin: 0 auto 20px;
        }

        h2.assinatura-titulo {
            font-family: 'Cinzel', serif;
            color: var(--ouro);
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .item-res { margin-bottom: 15px; line-height: 1.5; }
        .label-ouro { color: var(--ouro); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; display: block; }

        .dica-especial { 
            font-size: 0.85rem; 
            color: #bbb; 
            font-style: italic; 
            border-top: 1px solid #333; 
            padding-top: 15px; 
            margin-top: 15px; 
            display: block;
        }

        .btn-reset {
            background: none;
            border: none;
            color: var(--ouro);
            text-decoration: underline;
            margin-top: 25px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Cinzel', serif;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <img src="flat.jpg" alt="Logo Boutique Schiavon" class="logo-topo">
    <h1>Consultoria de Assinatura</h1>
    
    <div id="formulario">
        <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="text" id="data_nasc" placeholder="Ex: 19/02/1984">
        </div>

        <div class="form-group">
            <label>Nota Olfativa Favorita</label>
            <input type="text" id="nota_favorita" placeholder="Ex: Café, Baunilha...">
        </div>
        
        <div class="form-group">
            <label>Ocasião</label>
            <select id="ocasiao">
                <option value="reuniao">Trabalho / Reunião</option>
                <option value="festa">Festa / Evento</option>
                <option value="encontro_romantico">Encontro Romântico</option>
                <option value="balada">Balada</option>
                <option value="atividades_fisicas">Atividades Físicas</option>
            </select>
        </div>
        
        <button class="btn-revelar" onclick="gerarAnalise()">Revelar Minha Seleção</button>
    </div>

    <div id="resultado">
        <div class="card-consultoria">
            <img src="Gemini_Generated_Image_jj1o7cjj1o7cjj1o.png" alt="Selo Presença" class="selo-presenca">
            <h2 class="assinatura-titulo">Sua assinatura Presença</h2>

            <div class="item-res">
                <span class="label-ouro">Identidade Astral:</span>
                <span id="res-identidade"></span>
            </div>

            <div class="item-res">
                <span class="label-ouro">Recomendação Schiavon:</span>
                <span id="res-recomendacao"></span>
            </div>

            <div class="item-res">
                <span class="label-ouro">Perfil Etário:</span>
                <span id="res-idade"></span>
            </div>
            
            <span class="dica-especial">
                Como você aprecia <strong id="res-nota-txt" style="color:var(--ouro);"></strong>, sugerimos aplicar a fragrância em pontos de pulsação para potencializar o rastro.
            </span>
        </div>
        
        <button class="btn-reset" onclick="window.location.reload()">Fazer Nova Consulta</button>
    </div>
</div>

<script>
    async function gerarAnalise() {
        const btn = document.querySelector('.btn-revelar');
        const notaInput = document.getElementById('nota_favorita').value;
        btn.innerText = "CONSULTANDO ACERVO...";
        
        const payload = {
            data_nasc: document.getElementById('data_nasc').value,
            ocasiao: document.getElementById('ocasiao').value,
            cidade: "Duque de Caxias" // Valor padrão
        };

        try {
            const resp = await fetch('https://app-perfumes-qf4c.onrender.com/selecao', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            const r = await resp.json();

            // CORREÇÃO DO ERRO UNDEFINED:
            // Verificamos se o r.identidade existe, senão usamos r.mensagem ou um fallback
            document.getElementById('formulario').style.display = 'none';
            document.getElementById('resultado').style.display = 'block';
            
            document.getElementById('res-identidade').innerText = r.identidade || "Análise astral indisponível";
            document.getElementById('res-recomendacao').innerText = r.recomendacao || "Fragrância sob consulta";
            document.getElementById('res-idade').innerText = r.idade_perfil || "Perfil atemporal";
            document.getElementById('res-nota-txt').innerText = notaInput || "notas nobres";

        } catch (e) {
            console.error(e);
            alert("Erro na conexão com o servidor. Verifique se o backend no Render está ativo.");
            btn.innerText = "REVELAR MINHA SELEÇÃO";
        }
    }
</script>

</body>
</html>
