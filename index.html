<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Schiavon - Consultoria de Assinatura</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ouro: #d4af37;
            --preto: #1a1a1a;
            --creme: #f5f2e9; /* Fundo creme conforme a imagem */
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--creme); 
            color: var(--preto); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
        }

        .container { 
            max-width: 480px; 
            width: 100%; 
            text-align: center;
        }

        /* Topo: Logotipo Pantera */
        .logo-topo {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 { 
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--ouro);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Estilização dos Campos de Entrada */
        .form-group { text-align: left; margin-bottom: 15px; }
        
        label { 
            display: block; 
            font-size: 0.85rem; 
            color: #444; 
            margin-bottom: 5px; 
        }

        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
            background: #fff;
            box-sizing: border-box;
        }

        /* Botão Principal Dourado */
        .btn-revelar { 
            width: 100%; 
            padding: 15px; 
            background: var(--preto); 
            color: var(--ouro); 
            border: none;
            border-radius: 5px;
            margin-top: 20px; 
            cursor: pointer; 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-revelar:hover { opacity: 0.9; }

        /* Resultado em Cartão Premium */
        #resultado { 
            display: none; 
            margin-top: 40px; 
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .selo-presenca {
            width: 100px;
            margin-bottom: 15px;
        }

        h2.assinatura-titulo {
            font-family: 'Cinzel', serif;
            color: var(--ouro);
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .card-conteudo {
            text-align: left;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .label-resultado { font-weight: 700; }
        
        .dica-uso { font-style: italic; color: #555; margin-top: 20px; display: block; }

        .btn-nova-consulta {
            background: none;
            border: none;
            color: #888;
            text-decoration: underline;
            margin-top: 30px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="flat.jpg" alt="Logo Boutique Schiavon" class="logo-topo">
    <h1>Boutique Schiavon - Consultoria de Assinatura</h1>
    
    <div id="formulario">
        <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="text" id="data_nasc" placeholder="19/02/84">
        </div>

        <div class="form-group">
            <label>Nota Olfativa Favorita</label>
            <input type="text" id="nota_favorita" placeholder="Baunilha">
        </div>
        
        <div class="form-group">
            <label>Ocasião</label>
            <select id="ocasiao">
                <option value="reuniao">Trabalho</option>
                <option value="festa">Festa</option>
                <option value="encontro_romantico">Encontro</option>
                <option value="balada">Balada</option>
            </select>
        </div>
        
        <button class="btn-revelar" onclick="gerarAnalise()">Revelar Minha Seleção</button>
    </div>

    <div id="resultado">
        <img src="Gemini_Generated_Image_jj1o7cjj1o7cjj1o.png" alt="Selo Presença" class="selo-presenca">
        <h2 class="assinatura-titulo">Sua assinatura Presença</h2>

        <div class="card-conteudo">
            <p><span class="label-resultado">Identidade:</span> <span id="res-identidade"></span></p>
            <p><span class="label-resultado">Recomendação:</span> <span id="res-recomendacao"></span></p>
            
            <span class="dica-uso">Como você aprecia <span id="res-nota"></span>, recomendamos aplicar o perfume em pontos de pulsação.</span>
            <span class="dica-uso">Aplique nos pontos de pulsação para uma melhor performance da fragrância.</span>
        </div>
        
        <button class="btn-nova-consulta" onclick="window.location.reload()">Fazer Nova Consulta</button>
    </div>
</div>

<script>
    async function gerarAnalise() {
        const payload = {
            data_nasc: document.getElementById('data_nasc').value,
            ocasiao: document.getElementById('ocasiao').value,
            nota: document.getElementById('nota_favorita').value
        };

        try {
            const resp = await fetch('https://app-perfumes-qf4c.onrender.com/selecao', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const r = await resp.json();

            document.getElementById('formulario').style.display = 'none';
            document.getElementById('resultado').style.display = 'block';
            
            document.getElementById('res-identidade').innerText = r.identidade;
            document.getElementById('res-recomendacao').innerText = r.recomendacao;
            document.getElementById('res-nota').innerText = payload.nota;
        } catch (e) {
            alert("Erro ao gerar consultoria.");
        }
    }
</script>

</body>
</html>
